<!DOCTYPE html>
<html lang="en">

{{> partials/shop-homepage-template}}

<body>
    <!-- Navigation-->

    {{> partials/nav-anonymous}}

    <!-- Header-->
    {{> partials/hero-section}}


    {{> partials/filters}}


    <!-- Section-->
    <section class="py-5"
        style="background-image: linear-gradient(rgba(0,0,0,0.5), rgba(0,0,0,0.5)), url({{backgroundSectionImage}}); background-size: cover; background-position: center; background-repeat: no-repeat; min-height:40vh">
        <div class="container px-4 px-lg-5 mt-5">
            <div id="itemsContainer"
                class="row gx-4 gx-lg-5 row-cols-2 row-cols-md-3 row-cols-xl-4 justify-content-center">

                {{> partials/section-elements}}


            </div>


            <div class="d-flex justify-content-center">


                {{^searchName}}
                {{#admin}}
                <div class="d-flex gap-3">
                    <a href="/admin/objects/new?sectionName={{sectionName}}" class="btn btn-secondary px-3">
                        <i class="bi bi-plus"></i>
                        Añadir
                    </a>
                    {{/admin}}


                    <button id="loadItems" class="btn btn-secondary px-3" type="button">
                        <i class="bi bi-eye-fill"></i>
                        Ver más
                    </button>
                </div>
                {{/searchName}}
            </div>

            <div id="spinner" style="display:none; text-align:center; margin-top:20px;">
                <div class="spinner-border text-light"></div>
            </div>
        </div>


    </section>
    <!-- Footer-->
    {{> partials/footer}}
    <!-- Bootstrap core JS-->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/js/bootstrap.bundle.min.js"></script>
    <!-- Core theme JS-->
    <script src="/assets/js/loadMoreObjects.js"></script>
</body>

</html>
