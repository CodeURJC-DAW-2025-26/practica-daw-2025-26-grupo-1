<section class="p-3 text-bg-dark">
    <div class="container">
        <div class="d-flex flex-wrap align-items-center justify-content-center justify-content-lg-start gap-3"> <a
                href="/" class="d-flex align-items-center mb-2 mb-lg-0 text-white text-decoration-none"> <svg
                    class="bi me-2" width="40" height="32" role="img" aria-label="Bootstrap">
                    <use xlink:href="#bootstrap"></use>
                </svg> </a>

            {{#logged}}
            {{#buttons}}
            <a href="/section/{{sectionName}}?category={{text}}" class="btn {{type}} px-3"> {{text}} </a>
            {{/buttons}}
            {{/logged}}



            <form class="card p-2 ms-lg-auto" action="/section/{{sectionName}}" method="get">
                <div class="input-group"> 
                    <input type="text" name="searchName" class="form-control">
                    <button type="submit" class="btn btn-secondary">
                        <i class="bi bi-search"></i>
                        Buscar</button>
                </div>
            </form>


        </div>
    </div>
</section>
