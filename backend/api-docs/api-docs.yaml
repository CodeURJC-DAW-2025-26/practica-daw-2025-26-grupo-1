components:
  schemas:
    ElementDTO:
      type: object
      properties:
        id:
          type: integer
          format: int64
        nameElement:
          type: string
        objectSectionImage:
          $ref: "#/components/schemas/ImageDTO"
        category:
          type: string
        goToElement:
          type: string
    ImageDTO:
      type: object
      properties:
        id:
          type: integer
          format: int64
    UserDTO:
      type: object
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        password:
          type: string
        roles:
          type: array
          items:
            type: string
        seen:
          type: array
          items:
            $ref: "#/components/schemas/ElementDTO"
    UserBasicDTO:
      type: object
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        roles:
          type: array
          items:
            type: string
    MuseumObjectDTO:
      type: object
      properties:
        id:
          type: integer
          format: int64
        objectName:
          type: string
        groupName:
          type: string
        technicalData:
          type: string
        description:
          type: string
        category:
          type: string
        notes:
          type: array
          items:
            $ref: "#/components/schemas/NoteDTO"
        isSeen:
          type: boolean
    NoteDTO:
      type: object
      properties:
        id:
          type: integer
          format: int64
        text:
          type: string
        user:
          $ref: "#/components/schemas/UserDTO"
        museumObject:
          $ref: "#/components/schemas/MuseumObjectDTO"
    MuseumObjectBasicDTO:
      type: object
      properties:
        id:
          type: integer
          format: int64
        objectName:
          type: string
        groupName:
          type: string
        technicalData:
          type: string
        description:
          type: string
        category:
          type: string
        isSeen:
          type: boolean
    NoteBasicDTO:
      type: object
      properties:
        id:
          type: integer
          format: int64
        text:
          type: string
        user:
          $ref: "#/components/schemas/UserDTO"
    AuthResponse:
      type: object
      properties:
        status:
          type: string
          enum:
          - SUCCESS
          - FAILURE
        message:
          type: string
        error:
          type: string
    LoginRequest:
      type: object
      properties:
        username:
          type: string
        password:
          type: string
    CategoryStatsDTO:
      type: object
      properties:
        categoryName:
          type: string
        seenCount:
          type: integer
          format: int32
        totalInCategory:
          type: integer
          format: int32
        percentage:
          type: number
          format: double
    UserStatisticsDTO:
      type: object
      properties:
        userName:
          type: string
        globalTotalSeen:
          type: integer
          format: int64
        statsByCategory:
          type: array
          items:
            $ref: "#/components/schemas/CategoryStatsDTO"
        globalTotals:
          type: object
          additionalProperties:
            type: integer
            format: int64
    Pageable:
      type: object
      properties:
        page:
          type: integer
          format: int32
          minimum: 0
        size:
          type: integer
          format: int32
          minimum: 1
        sort:
          type: array
          items:
            type: string
    PageMetadata:
      type: object
      properties:
        size:
          type: integer
          format: int64
        number:
          type: integer
          format: int64
        totalElements:
          type: integer
          format: int64
        totalPages:
          type: integer
          format: int64
    PagedModelUserBasicDTO:
      type: object
      properties:
        content:
          type: array
          items:
            $ref: "#/components/schemas/UserBasicDTO"
        page:
          $ref: "#/components/schemas/PageMetadata"
    PagedModelElementDTO:
      type: object
      properties:
        content:
          type: array
          items:
            $ref: "#/components/schemas/ElementDTO"
        page:
          $ref: "#/components/schemas/PageMetadata"
    PagedModelNoteDTO:
      type: object
      properties:
        content:
          type: array
          items:
            $ref: "#/components/schemas/NoteDTO"
        page:
          $ref: "#/components/schemas/PageMetadata"
    SectionDTO:
      type: object
      properties:
        nameSection:
          type: string
        iconUrl:
          type: string
        link:
          type: string
        categories:
          type: array
          items:
            type: string
    PagedModelImageDTO:
      type: object
      properties:
        content:
          type: array
          items:
            $ref: "#/components/schemas/ImageDTO"
        page:
          $ref: "#/components/schemas/PageMetadata"
