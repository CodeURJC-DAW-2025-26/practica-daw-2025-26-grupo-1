<!DOCTYPE html>
<html lang="en">

{{> partials/dashboard-sb-template}}

<body class="sb-nav-fixed">
    {{> partials/nav-anonymous}}

    <div id="layoutSidenav_content" style="min-height: 80vh;">
        <div class="container-fluid px-4">

            <div class="row align-items-center mt-4 mb-4">
                <div class="col-3">
                    <a href="/" class="btn btn-danger px-3" type="button">
                        <i class="bi bi-arrow-left"></i>
                        Volver
                    </a>
                </div>
                <div class="col-6 text-center">
                    <h1 class="mt-4">Gestión de Usuarios</h1>
                </div>
                <div class="col-3"></div>
            </div>

            <div class="card mb-4">
                <div class="card-header">
                    <i class="fas fa-users me-1"></i>
                    Usuarios registrados en el sistema
                </div>
                <div class="card-body">
                    <table class="table table-bordered table-striped align-middle">
                        <thead>
                            <tr>
                                <th>ID</th>
                                <th>Nombre</th>
                                <th>Roles</th>
                                <th class="text-center">Acciones</th>
                            </tr>
                        </thead>
                        <tbody>
                            {{#users}}
                            <tr>
                                <td>{{id}}</td>
                                <td><strong>{{name}}</strong></td>
                                <td>
                                    {{#roles}}
                                    <span class="badge bg-secondary">{{.}}</span>
                                    {{/roles}}
                                </td>
                                <td class="text-center">
                                    <div class="d-flex justify-content-center gap-2">
                                        <a href="/profile/{{id}}" class="btn btn-sm btn-primary">
                                            <i class="bi bi-eye"></i> Perfil
                                        </a>

                                        <form action="/admin/users/delete/{{id}}" method="post">
                                            <input type="hidden" name="_csrf" value="{{token}}">
                                            <button type="submit" class="btn btn-sm btn-danger">
                                                <i class="bi bi-trash"></i>
                                                Eliminar perfil
                                            </button>
                                        </form>
                                    </div>
                                </td>
                            </tr>
                            {{/users}}
                        </tbody>
                    </table>
                </div>
            </div>

            {{> partials/footer}}
        </div>
    </div>

   <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/js/bootstrap.bundle.min.js"
            crossorigin="anonymous"></script>
        <script src="js/scripts.js"></script>
        <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/2.8.0/Chart.min.js"
            crossorigin="anonymous"></script>
        <script src="assets/demo/chart-area-demo.js"></script>
        <script src="assets/demo/chart-bar-demo.js"></script>
        <script src="https://cdn.jsdelivr.net/npm/simple-datatables@7.1.2/dist/umd/simple-datatables.min.js"
            crossorigin="anonymous"></script>
        <script src="js/datatables-simple-demo.js"></script>
</body>
</html>
